mode = "suggest_then_auto_use"
require_explicit_composio_invocation = true
blocked_skills = []

# Governance: AGENTS.md defines authorisation, environment and independent audit gates.
# This TOML defines capability routing only; it never grants production/billing/provider
# mutation authority. Use the R0–R13 roadmap and existing DF/M/spec contracts for scope.

# Preferred order is by fitness, not a fixed local-only restriction:
# - For source work: local filesystem, git history/diff, tests/builds and repo search.
# - For GitHub/CI: local `git`/`gh` using established credentials, or a connected GitHub tool.
# - For Cloud Run/Firebase/GCP: authenticated `gcloud`/Firebase CLI or connected provider UI.
# - For databases and services: approved read-only provider console/connector or scoped CLI.
# - For UI: browser/Playwright on the actual local or sandbox environment, including mobile.
# - For moving provider facts: current official provider docs; never infer runtime state.
# - For complex tasks: a small number of complementary skills/subagents, not a tool parade.

# Existing authentication is the first option:
# - Check active account + project/scope without emitting secrets; use supported token caches.
# - Reuse already authenticated CLI/browser/connector sessions wherever permitted.
# - Do not extract cookies/tokens, bypass MFA, paste secrets in chat or copy production keys.
# - If unavailable/expired, request the smallest specific official user-side login/consent
#   step in a trusted local UI. Continue nonblocked work, then recheck and resume.
# - Do not confuse interactive management login with managed production runtime identity.
# - Do not claim an integration is authenticated until actual read access is confirmed.

# Repo read/local-authorised edits and tests can proceed using available access.
# New implementation work stays local until independently audited (AGENTS.md §6A).
# Accepted exact SHA: authorised agent can execute remote and dev-sandbox work per gate.
# Gated production, live billing, auth/credential and destructive real-data actions stay gated.

# Skill routing:
# - Workflow across UI/API/data/automation/notifications/ops -> dtd-feature-workflow-completion.
# - Public page copy/CTA/accessible mobile visual polish -> dtd-premium-look-audit.
# - Cross-stage planning, owner exception triage, conflicting evidence -> dtd-proactive-owner-assistance.
# - Scope R0–R2: release consolidation only; never treat mention of /ops as permission
#   to restart previously accepted Ops phases 1–5A.
# - Scope R3–R8: use existing M/DF identifiers and verify only current acceptance gaps.
# - Scope R10–R12: measure user/trainer value, payment outcomes and workload with
#   consented and privacy-bounded data; metrics are not R1–R2 release prerequisites.

# Browser/connector priority:
# - If a user explicitly requests an available named integration, prefer it.
# - For authenticated sessions where browser state matters, use a supported logged-in
#   browser tool; never assume ordinary HTTP fetch can access a logged-in session.
# - For data mutations prefer official, auditable API/CLI over fragile UI automation where
#   either is authorised; do not bypass platform safeguards or owner action prompts.
# - For absent capabilities, use safe fallback tools; state the exact verification gap.

# Response discipline:
# - Reuse accepted evidence; select proportionate tests for actual changed paths.
# - Avoid broad permission queries and repeated plan-only outputs.
# - Give exact provider, account/project and required trusted-local login step if blocked.
# - Report what changed, proved, remains blocked, cleanup and one next work package.
