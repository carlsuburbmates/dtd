name: Verify

on:
  pull_request:
  push:

jobs:
  verify:
    name: Verify / verify
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend checks
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m py_compile backend/server.py backend/worker.py backend/services/*.py
          python backend/scripts/run_isolated_integration_suite.py
          node scripts/check_prelaunch_release_gate.js

      - name: Frontend checks
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile
          CI=true yarn test --watch=false
          yarn build
