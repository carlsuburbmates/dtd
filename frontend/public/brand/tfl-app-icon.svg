<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="The First Leash App Icon">
  <defs>
    
    <linearGradient id="tfl-gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FCE19D"/>
      <stop offset="50%" stop-color="#EBC16A"/>
      <stop offset="100%" stop-color="#D49A32"/>
    </linearGradient>
    <linearGradient id="tfl-terracotta" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#E87652"/>
      <stop offset="50%" stop-color="#D35D39"/>
      <stop offset="100%" stop-color="#B84220"/>
    </linearGradient>
    <filter id="paw-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="tile-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A3A32"/>
      <stop offset="100%" stop-color="#0F241F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile-bg)" stroke="#2D5A4E" stroke-width="4"/>
  <g transform="translate(96 96)">
    
  <g filter="url(#paw-shadow)" stroke="#111111" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main Diamond Shield Pad -->
    <path d="M 160 88 C 150 115 125 132 108 145 C 80 167 56 182 58 202 C 60 220 75 235 96 254 L 152 308 C 156 312 164 312 168 308 L 224 254 C 245 235 260 220 262 202 C 264 182 240 167 212 145 C 195 132 170 115 160 88 Z" fill="url(#tfl-gold)" />
    
    <!-- Toe 1 (Outer Left - Gold) -->
    <ellipse cx="43" cy="115" rx="34" ry="47" transform="rotate(-24 43 115)" fill="url(#tfl-gold)" />
    
    <!-- Toe 2 (Inner Left - Terracotta) -->
    <ellipse cx="109" cy="62" rx="37" ry="50" transform="rotate(-9 109 62)" fill="url(#tfl-terracotta)" />
    
    <!-- Toe 3 (Inner Right - Gold) -->
    <ellipse cx="211" cy="62" rx="37" ry="50" transform="rotate(9 211 62)" fill="url(#tfl-gold)" />
    
    <!-- Toe 4 (Outer Right - Terracotta) -->
    <ellipse cx="277" cy="115" rx="34" ry="47" transform="rotate(24 277 115)" fill="url(#tfl-terracotta)" />
  </g>

  </g>
</svg>